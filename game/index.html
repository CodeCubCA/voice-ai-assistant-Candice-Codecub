<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Game Computer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Boot Screen -->
    <div id="boot-screen" class="boot-screen bios-mode">
        <div class="bios-text">
            <div id="bios-output"></div>
        </div>
        <div class="windows-loader hidden" id="windows-loader">
            <div class="windows-logo">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="login-screen hidden">
        <div class="login-container">
            <div class="user-avatar">
                <div class="avatar-icon"></div>
            </div>
            <div class="username">Player</div>
            <input type="password" id="password-input" class="password-input" placeholder="Password" autocomplete="off">
            <div class="login-hint">Hint: Press Enter or click the arrow</div>
            <button id="login-btn" class="login-btn">→</button>
            <div class="login-loading">
                <div class="login-spinner"></div>
            </div>
        </div>
        <div class="login-footer">
            <div class="power-options">
                <button class="power-btn" title="Sleep">⏾</button>
                <button class="power-btn" title="Shut down">⏻</button>
                <button class="power-btn" title="Restart">↻</button>
            </div>
        </div>
    </div>

    <!-- Desktop -->
    <div id="desktop" class="desktop hidden">
        <!-- Desktop Icons -->
        <div class="desktop-icons">
            <div class="desktop-icon" data-app="rcfc">
                <div class="icon-image rcfc-icon"></div>
                <span>RCFC</span>
            </div>
            <div class="desktop-icon" data-app="messages">
                <div class="icon-image messages-icon"></div>
                <span>Messages</span>
            </div>
            <div class="desktop-icon" data-app="browser">
                <div class="icon-image browser-icon"></div>
                <span>Browser</span>
            </div>

                <span>Notepad</span>
            </div>
        </div>

        <!-- Window Container -->
        <div id="window-container"></div>

        <!-- Taskbar -->
        <div class="taskbar">
            <button class="start-btn" id="start-btn">
                <div class="start-icon"></div>
            </button>
            <div class="taskbar-apps" id="taskbar-apps"></div>
            <div class="system-tray">
                <div class="tray-icons">
                    <span class="tray-icon" title="Network">📶</span>
                    <span class="tray-icon" title="Sound">🔊</span>
                    <span class="tray-icon" title="Battery">🔋</span>
                </div>
                <div class="datetime" id="datetime"></div>
            </div>
        </div>

        <!-- Start Menu -->
        <div id="start-menu" class="start-menu hidden">
            <div class="start-menu-left">
                <input type="text" class="start-menu-search" placeholder="Type here to search">
                <div class="start-menu-section">
                    <div class="start-menu-section-title">Pinned</div>
                    <div class="start-menu-grid">
                        <div class="start-menu-item" data-app="rcfc">
                            <div class="menu-icon rcfc-icon"></div>
                            <span>RCFC</span>
                        </div>
                        <div class="start-menu-item" data-app="messages">
                            <div class="menu-icon messages-icon"></div>
                            <span>Messages</span>
                        </div>
                        <div class="start-menu-item" data-app="browser">
                            <div class="menu-icon browser-icon"></div>
                            <span>Browser</span>
                        </div>
                        <div class="start-menu-item" data-app="notepad">
                            <div class="menu-icon notepad-icon"></div>
                            <span>Notepad</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="start-menu-footer">
                <div class="start-menu-user">
                    <div class="user-avatar-small"></div>
                    <span>Player</span>
                </div>
                <button class="start-power-btn" id="shutdown-btn">
                    <span>⏻</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu hidden">
        <div class="context-item" data-action="refresh">Refresh</div>
        <div class="context-separator"></div>
        <div class="context-item" data-action="newfile">New → Text Document</div>
        <div class="context-item" data-action="newfolder">New → Folder</div>
        <div class="context-separator"></div>
        <div class="context-item" data-action="display">Display settings</div>
        <div class="context-item" data-action="personalize">Personalize</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
